name: CI

# Vercel builds and deploys this repository on its own. What it will not do is
# refuse a deployment because the tests are red — it only cares that the build
# command exits zero. So this workflow is the only place that can say no.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Building here too, because a type-clean, well-tested app can still fail
      # to bundle — and finding that out from a failed Vercel deploy is finding
      # out late.
      - run: npm run build
