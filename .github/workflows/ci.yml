name: CI & Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only one deployment at a time; a superseded run is cancelled rather than
# queued behind the newer build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Build
        env:
          # The repository name is the GitHub Pages sub-path, so every asset URL
          # has to be prefixed with it.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional defaults; the in-app Configuration screen overrides them.
          # None of these is a secret: the Supabase anon key is public by design
          # and the Spotify PKCE flow ships no client secret.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
