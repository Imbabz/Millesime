name: Vérifier les années du deck

# It takes half an hour and leans on a volunteer-run service, so it does not run
# on every push. It runs on demand, and whenever the verification logic itself
# changes — a new matching rule is worth re-checking the whole deck against.
on:
  workflow_dispatch:
    inputs:
      only:
        description: >
          Cartes à vérifier : "new" pour celles qui n'ont pas encore d'année
          vérifiée, une liste d'identifiants séparés par des virgules, ou vide
          pour balayer tout le deck.
        required: false
        default: new
  push:
    # Only on this repository's own default branch. The branch is staged inside
    # another repository before it lands here, and a half-hour sweep firing
    # there is half an hour of nothing.
    branches: [main]
    paths:
      - 'scripts/verify-years.mjs'
      - '.github/workflows/verify-years.yml'

concurrency:
  # MusicBrainz is volunteer-run and the sweep paces itself at one request per
  # second; two at once is both impolite and slower than one.
  group: verify-years
  cancel-in-progress: true

jobs:
  verify:
    name: Comparer le catalogue à MusicBrainz
    runs-on: ubuntu-latest
    # The sweep paces itself at one request per second by design, and backs off
    # further when MusicBrainz asks it to; the ceiling is here only so a hung
    # fetch cannot burn an hour.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Interroger MusicBrainz
        env:
          # A push means the matching logic changed, and that deserves the whole
          # deck. A manual run defaults to the cards that have no verified year
          # yet, which is what adding cards needs and takes minutes, not an hour.
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
        run: npm run verify:years

      - name: Publier le rapport
        # Uploaded even on failure: a partial sweep is still worth reading, and
        # the script writes as it goes precisely so that stays true.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: years-report
          path: years.report.json
          if-no-files-found: warn

      - name: Résumé
        if: always()
        run: |
          node -e '
            const r = require("./years.report.json");
            const line = (s) => process.stdout.write(s + "\n");
            line("| | |");
            line("|---|---|");
            line(`| Concordances | ${r.agree.length} |`);
            line(`| Écarts | ${r.disagree.length} |`);
            line(`| Introuvables | ${r.missing.length} |`);
            line(`| Échecs réseau | ${r.failed.length} |`);
            line("");
            line("### Écarts les plus importants");
            line("| Carte | Catalogue | MusicBrainz | Écart |");
            line("|---|---|---|---|");
            for (const d of r.disagree.slice(0, 40)) {
              line(`| ${d.artist} — ${d.title} | ${d.year} | ${d.mbYear} | ${d.delta > 0 ? "+" : ""}${d.delta} |`);
            }
          ' >> "$GITHUB_STEP_SUMMARY"
